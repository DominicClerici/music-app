# pop_rock reference timbres (PHASE_7 §8.1) — complete real content under the
# sound.timbres.TimbresConfig schema. Every interpreter.yaml-declared flavor id
# carries a full recipe (TB1 unconditional). Mapped params (resonance,
# noise.playbackRate, filterEnvelope.baseFrequency/octaves, filter.Q,
# envelope.attack, mix.sends.reverb) are omitted from `base`/`mix` — the merged
# mod tables are their sole authority (§3.3 base XOR mod).

flavors:
  drums:
    acoustic_kit:
      kit:
        kick:
          midi: 24
          patch:
            type: MembraneSynth
            options:
              pitchDecay: 0.05
              octaves: 4
              oscillator: { type: sine }
              envelope:
                { attack: 0.001, decay: 0.4, sustain: 0.01, release: 1.4, attackCurve: exponential }
          mix: { volumeDb: -9, pan: 0 }
        snare:
          patch:
            type: NoiseSynth
            options:
              volume: -4
              noise: { type: pink }
              envelope: { attack: 0.001, decay: 0.13, sustain: 0, release: 0.03 }
          mix: { volumeDb: -10.5, pan: 0 }
        hats:
          midi: 80
          patch:
            type: MetalSynth
            options:
              volume: -12
              frequency: 250
              harmonicity: 5.1
              modulationIndex: 32
              octaves: 1.5
              envelope: { attack: 0.001, decay: 0.05, release: 0.01 }
          mix: { volumeDb: -17, pan: 0.3, sends: { reverb: -20 } }
        ride:
          midi: 82
          patch:
            type: MetalSynth
            options:
              volume: -12
              frequency: 400
              harmonicity: 12
              modulationIndex: 16
              octaves: 1
              envelope: { attack: 0.001, decay: 0.35, release: 0.5 }
          mix: { volumeDb: -19, pan: -0.2, sends: { reverb: -18 } }
        crash:
          midi: 84
          patch:
            type: MetalSynth
            options:
              volume: -12
              frequency: 300
              harmonicity: 5.1
              modulationIndex: 32
              octaves: 1.5
              envelope: { attack: 0.001, decay: 1.5, release: 1.5 }
          mix: { volumeDb: -14, pan: -0.35 }
        tom_low:
          midi: 43
          patch:
            type: MembraneSynth
            options:
              pitchDecay: 0.05
              octaves: 5
              oscillator: { type: sine }
              envelope: { attack: 0.001, decay: 0.35, sustain: 0, release: 0.3 }
          mix: { volumeDb: -13, pan: -0.3 }
        tom_mid:
          midi: 47
          patch:
            type: MembraneSynth
            options:
              pitchDecay: 0.05
              octaves: 5
              oscillator: { type: sine }
              envelope: { attack: 0.001, decay: 0.35, sustain: 0, release: 0.3 }
          mix: { volumeDb: -13, pan: -0.1 }
        tom_high:
          midi: 50
          patch:
            type: MembraneSynth
            options:
              pitchDecay: 0.05
              octaves: 5
              oscillator: { type: sine }
              envelope: { attack: 0.001, decay: 0.35, sustain: 0, release: 0.3 }
          mix: { volumeDb: -13, pan: 0.15 }
        perc:
          patch:
            type: NoiseSynth
            options:
              volume: -6
              noise: { type: white }
              envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 }
          mix: { volumeDb: -16, pan: 0.2 }
    tight_kit:
      # shiny.html kick (square4, pitchDecay 0.02, octaves 6, decay 0.2),
      # snappier snare (decay 0.09), shorter/brighter hats (decay 0.03), brighter
      # MetalSynth base frequencies; same midi/mix/mapped params as acoustic_kit.
      kit:
        kick:
          midi: 24
          patch:
            type: MembraneSynth
            options:
              pitchDecay: 0.02
              octaves: 6
              oscillator: { type: square4 }
              envelope:
                { attack: 0.001, decay: 0.2, sustain: 0.01, release: 1.4, attackCurve: exponential }
          mix: { volumeDb: -9, pan: 0 }
        snare:
          patch:
            type: NoiseSynth
            options:
              volume: -4
              noise: { type: pink }
              envelope: { attack: 0.001, decay: 0.09, sustain: 0, release: 0.03 }
          mix: { volumeDb: -10.5, pan: 0 }
        hats:
          midi: 80
          patch:
            type: MetalSynth
            options:
              volume: -12
              frequency: 320
              harmonicity: 5.1
              modulationIndex: 32
              octaves: 1.5
              envelope: { attack: 0.001, decay: 0.03, release: 0.01 }
          mix: { volumeDb: -17, pan: 0.3, sends: { reverb: -20 } }
        ride:
          midi: 82
          patch:
            type: MetalSynth
            options:
              volume: -12
              frequency: 480
              harmonicity: 12
              modulationIndex: 16
              octaves: 1
              envelope: { attack: 0.001, decay: 0.35, release: 0.5 }
          mix: { volumeDb: -19, pan: -0.2, sends: { reverb: -18 } }
        crash:
          midi: 84
          patch:
            type: MetalSynth
            options:
              volume: -12
              frequency: 360
              harmonicity: 5.1
              modulationIndex: 32
              octaves: 1.5
              envelope: { attack: 0.001, decay: 1.5, release: 1.5 }
          mix: { volumeDb: -14, pan: -0.35 }
        tom_low:
          midi: 43
          patch:
            type: MembraneSynth
            options:
              pitchDecay: 0.05
              octaves: 5
              oscillator: { type: sine }
              envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.3 }
          mix: { volumeDb: -13, pan: -0.3 }
        tom_mid:
          midi: 47
          patch:
            type: MembraneSynth
            options:
              pitchDecay: 0.05
              octaves: 5
              oscillator: { type: sine }
              envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.3 }
          mix: { volumeDb: -13, pan: -0.1 }
        tom_high:
          midi: 50
          patch:
            type: MembraneSynth
            options:
              pitchDecay: 0.05
              octaves: 5
              oscillator: { type: sine }
              envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.3 }
          mix: { volumeDb: -13, pan: 0.15 }
        perc:
          patch:
            type: NoiseSynth
            options:
              volume: -6
              noise: { type: white }
              envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.02 }
          mix: { volumeDb: -16, pan: 0.2 }

  bass:
    electric_fingered: # canonical monoSynth.html bass
      engine: { type: MonoSynth }
      base:
        oscillator: { type: square8 }
        envelope: { decay: 0.3, sustain: 0.4, release: 0.8 } # attack mapped
        filter: { type: lowpass, rolloff: -12 } # Q mapped
        filterEnvelope: { attack: 0.001, decay: 0.7, sustain: 0.1, release: 0.8 }
          # baseFrequency + octaves mapped
      effects: []
      mix: { volumeDb: -11, pan: 0 } # no send: bass dry
    electric_picked:
      engine: { type: MonoSynth }
      base:
        oscillator: { type: sawtooth }
        envelope: { decay: 0.2, sustain: 0.35, release: 0.6 }
        filter: { type: lowpass, rolloff: -12 }
        filterEnvelope: { attack: 0.001, decay: 0.25, sustain: 0.2, release: 0.5 }
      effects: []
      mix: { volumeDb: -11, pan: 0 }
      mod: # picked bite: brighter, snappier band
        brightness:
          - { param: filterEnvelope.baseFrequency, min: 200, max: 3500, curve: exp }
          - { param: filter.Q, min: 0.8, max: 2.0, curve: linear }
        attackHardness:
          - { param: envelope.attack, min: 0.04, max: 0.001, curve: exp }
          - { param: filterEnvelope.octaves, min: 1.5, max: 3.5, curve: linear }

  comping:
    clean_electric:
      engine: { type: PolySynth, voice: MonoSynth, maxPolyphony: 12 }
      base:
        oscillator: { type: triangle }
        envelope: { decay: 0.5, sustain: 0.3, release: 0.6 } # attack mapped
        filter: { type: lowpass, rolloff: -12, Q: 1 }
        filterEnvelope: { attack: 0.002, decay: 0.4, sustain: 0.4, release: 0.6, octaves: 2.2 }
          # baseFrequency mapped
      effects:
        - { type: Chorus, options: { frequency: 1.5, delayTime: 3.5, depth: 0.4, wet: 0.3 } }
      mix: { volumeDb: -13, pan: -0.3 } # reverb send mapped (space)
    crunch_electric: # as clean_electric: sawtooth osc, envelope decay 0.4 / sustain 0.35
      engine: { type: PolySynth, voice: MonoSynth, maxPolyphony: 12 }
      base:
        oscillator: { type: sawtooth }
        envelope: { decay: 0.4, sustain: 0.35, release: 0.6 } # attack mapped
        filter: { type: lowpass, rolloff: -12, Q: 1 }
        filterEnvelope: { attack: 0.002, decay: 0.4, sustain: 0.4, release: 0.6, octaves: 2.2 }
      effects:
        - { type: Distortion, options: { distortion: 0.4, oversample: "2x", wet: 0.6 } }
      mix: { volumeDb: -13, pan: -0.3 }
    piano: # stylized FM keys (§4.6)
      engine: { type: PolySynth, voice: FMSynth, maxPolyphony: 12 }
      base:
        harmonicity: 3
        oscillator: { type: sine }
        envelope: { decay: 1.2, sustain: 0.1, release: 1.2 } # attack mapped
        modulation: { type: sine }
        modulationEnvelope: { attack: 0.002, decay: 0.2, sustain: 0, release: 0.2 }
      effects: []
      mix: { volumeDb: -13, pan: -0.3 }
      mod:
        brightness: # FM lever, not cutoff
          - { param: modulationIndex, min: 4, max: 14, curve: exp }

  pads:
    warm_analog:
      engine: { type: PolySynth, voice: MonoSynth, maxPolyphony: 8 }
      base:
        oscillator: { type: fatsawtooth, count: 3, spread: 30 }
        envelope: { decay: 0.6, sustain: 0.5, release: 1.6 } # attack mapped
        filter: { type: lowpass, rolloff: -12, Q: 1 }
        filterEnvelope: { attack: 0.4, decay: 0.8, sustain: 0.6, release: 1.6, octaves: 2 }
          # baseFrequency mapped
      effects:
        - { type: Chorus, options: { frequency: 0.8, delayTime: 4, depth: 0.5, wet: 0.3 } }
        - { type: StereoWidener, options: { width: 0.7 } }
      mix: { volumeDb: -18, pan: 0 } # reverb send mapped (space)
    airy_strings: # as warm_analog: fatsawtooth count 4 spread 20; envelope decay 0.3 / sustain 0.8 / release 2.4
      engine: { type: PolySynth, voice: MonoSynth, maxPolyphony: 8 }
      base:
        oscillator: { type: fatsawtooth, count: 4, spread: 20 }
        envelope: { decay: 0.3, sustain: 0.8, release: 2.4 } # attack mapped
        filter: { type: lowpass, rolloff: -12, Q: 1 }
        filterEnvelope: { attack: 0.4, decay: 0.8, sustain: 0.6, release: 1.6, octaves: 2 }
      effects:
        - { type: Chorus, options: { frequency: 0.6, delayTime: 5, depth: 0.7, wet: 0.4 } }
        - { type: StereoWidener, options: { width: 0.7 } }
      mix: { volumeDb: -18, pan: 0 }

bus:
  reverb: { decay: [0.8, 3.0], preDelay: [0.01, 0.03], returnFilterHz: 350 }

master:
  - { type: Compressor, options: { threshold: -20, ratio: 2, attack: 0.03, release: 0.25 } }
  - { type: Limiter, options: { threshold: -1 } }
