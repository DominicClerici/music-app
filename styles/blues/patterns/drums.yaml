# blues drum pattern bank (PHASE_8 §5.4, under the SESSION_21 S21-2 re-map).
# Drum events only — drums are lane-exempt (§5.2), so no retarget. Carries the
# pack-level layeringOrder (§5.1/PT10). Velocities in the §5.4 Chicago idiom
# (accents ~0.42–0.94, gated ghosts/dormant-rung hats down to 0.30; ceiling 0.95).
#
# S21-2 rung re-map (user-ratified): blues' form is all-solo and the R2 solo
# arch puts every rendered section at energy >= 0.624 (rung 3 minimum), the
# final chorus at rung 4. So the REAL content lives at rungs 3–4; rungs 1–2 are
# sparser completeness variants (required by PT5 + the variety lint, dormant in
# practice). No unreachable-content annotation: the [0.15, 0.95] envelope makes
# all four rungs lint-reachable (the dormancy is arousal-scaling, invisible to
# the linter — recorded in the caveat, not here).
#
# id scheme: the numeric suffix tracks the RUNG, with one pinned exception —
# `bl_dr_2` is the §5.4 defining Chicago-shuffle entry (id + events preserved
# verbatim) which the S21-2 ruling re-maps to `energyLevel: 3`. Its rung-3
# sibling is `bl_dr_3b`; the rung-2 lighter-Chicago mains therefore use the
# `bl_dr_lc` ("light Chicago") ids to avoid colliding with the pinned `bl_dr_2`.
# Slow-blues 12/8 patterns are `bl_dr_3s`/`bl_dr_3sb` (triplet grid, §3.1),
# tempo-gated to [50, 75] (do NOT count toward variety — 2 ungated rung-3 mains
# stand beside them). cross-stick is authored as the `perc` voice (§3.6; no
# `cross_stick` voice exists in the DrumVoice enum).
layeringOrder: [drums, bass, comping, pads]
patterns:
