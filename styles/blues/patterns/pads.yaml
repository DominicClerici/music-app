# blues pads pattern bank (PHASE_8 §5.4).
# Rung-1/2 mains are dormant grid-wide (annotated per-id below; C-23, see
# drums.yaml for detail). Sustained degree: chord "football"
# hits — the organ pad holding whole notes under the shuffle. Bank retarget is
# the §5.4/constraint-10 default {45, 64, retrigger} (the pattern-fold window
# only — chord-voicing registers are owned by the arrangement pads lane, C-21).
# voicing.classes voices triad_open / fifths at every rung (§5.4).
#
# Pads DO render in blues — high-arousal moods reach layersMax 4 — so these are
# real audible content, not filler. Velocities are soft (organ swell under the
# band) and rise gently across the rungs.
#
# Ladder is monotone AND the sibling velocity bands are strictly non-overlapping
# rung-to-rung, with >= 0.05 mean deltas between rungs (the C5/C6 pad-ladder
# lesson): every rung's [main, variant] pair sits in its own band, and the next
# rung's band opens above it. Every entry is a single sustained whole note
# (siblings a fractioned re-voice at intro/ending only), so density is flat and
# velocity carries the ladder.
voicing:
  classes:
    1: [triad_open, fifths]
    2: [triad_open, fifths]
    3: [triad_open, fifths]
    4: [triad_open, fifths]
retarget: { registerLow: 45, registerHigh: 64, onChordChange: retrigger }
patterns:
  # rung 1 — whole-note football, softest sustained wash
  - id: bl_pd_1  # expected-unreachable — C-23: rung-1 main, all-solo form × R2 arch floors every body section at rung 3+
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.30 }

  # rung 1 (variant) — whole-note wash a touch warmer, in-band
  - id: bl_pd_1b  # expected-unreachable — C-23: rung-1 main, all-solo form × R2 arch floors every body section at rung 3+
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.34 }

  # rung 2 — whole-note football, band opens above rung 1
  - id: bl_pd_2  # expected-unreachable — C-23: rung-2 main, all-solo form × R2 arch floors every body section at rung 3+
    role: pads
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.38 }

  # rung 2 (variant) — whole-note wash, in-band
  - id: bl_pd_2b  # expected-unreachable — C-23: rung-2 main, all-solo form × R2 arch floors every body section at rung 3+
    role: pads
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.42 }

  # rung 3 — whole-note football, fuller organ swell
  - id: bl_pd_3
    role: pads
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.45 }

  # rung 3 (variant) — whole-note wash, in-band
  - id: bl_pd_3b
    role: pads
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.49 }

  # rung 4 — whole-note football, the warmest pad (still soft under the band)
  - id: bl_pd_4
    role: pads
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.51 }

  # rung 4 (variant) — whole-note wash sibling, in-band
  - id: bl_pd_4b
    role: pads
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.55 }

  # intro — whole-note wash, quietest entry
  - id: bl_pd_i
    role: pads
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.30 }

  # intro (variant) — two soft swells fading in
  - id: bl_pd_ib
    role: pads
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 960, degree: chord, velocity: 0.29 }
      - { pos: 960, dur: 960, degree: chord, velocity: 0.31 }

  # ending — whole-note wash, rings out
  - id: bl_pd_e
    role: pads
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.33 }

  # ending (variant) — sustain with a settling beat-4 re-voice
  - id: bl_pd_eb
    role: pads
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1440, degree: chord, velocity: 0.33 }
      - { pos: 1440, dur: 480, degree: chord, velocity: 0.31 }
