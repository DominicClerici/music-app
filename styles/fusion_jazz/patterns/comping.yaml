# fusion_jazz comping pattern bank (PHASE_8 §6.4 — Rhodes/clav).
# degree: chord rhythm cells; the voicing pass supplies the pitches. Bank
# retarget is the §6.4/constraint-13 default {50, 69, retrigger} (the
# pattern-fold window only — chord-voicing registers are owned by the
# arrangement comping lane, C-21; these values do NOT enforce a register floor).
#
# Rung character per §6.4: rung 1 footballs; rung 2 sparse syncopated stabs with
# an and-of-4 push; rung 3 16th anticipations (hits on the 16th before the beat);
# rung 4 clav-style stabby 16ths.
#
# voicing.classes: amended 2026-07-21 (S22-4, user-ratified). §6.4 prints rungs
# 1-2 as [quartal, rootless_a]; both classes come back EMPTY for `Bbm9` (i7+9 in
# Bb dorian — §6.1's pinned Chameleon key) and `A7#9` (V7(#9) in D dorian) at
# comping lane low 50 (registerBias >= +0.15 => calm/triumphant/happy), and
# parts/voicing.py:95-98 then raises an uncaught ValueError (measured 54 of 1152
# explicit-key renders). quartal's [0,5,10,15] needs a 15-semitone span but the
# comping lane leaves only a 7-9 semitone root window. `rootless_b` fits both
# ([56,60,61,65] / [55,60,61,64]); adding it is a pure data fix. quartal is still
# tried FIRST at rungs 1-2, so it remains the pinned low-rung signature.
#
# S22-5 dormancy: rung 1 is dead grid-wide (the lowest reachable pre-envelope
# energy is 0.185, above rung 1's 0.1333 ceiling) and rung-2 comping renders only
# in tune/head + vamp/main at calm/dreamy/nostalgic. The ladder is authored
# EXACTLY as §6.4 prints it — no re-map — because PT5 + the variety lint require
# an ungated rung-1..4 bank regardless and rungs 2-4 all carry live content.
# Dormancy is caveat-recorded (C-28), not lint-annotated.
#
# Grid: fusion is all-straight (constraint 11 / C-24). Every authored pos
# satisfies pos % 120 == 0 — 16ths only, no triplet (160/320) content anywhere.
#
# Ladder is monotone in BOTH density and velocity, with strictly non-overlapping
# velocity bands rung-to-rung: r1 [0.46, 0.48] < r2 [0.54, 0.58] < r3 [0.64,
# 0.70] < r4 [0.72, 0.80]; event counts 1-2 / 3-4 / 5-6 / 8.
voicing:
  classes:
    1: [quartal, rootless_a, rootless_b]
    2: [quartal, rootless_a, rootless_b]
    3: [rootless_a, rootless_b]
    4: [rootless_a, rootless_b]
retarget: { registerLow: 50, registerHigh: 69, onChordChange: retrigger }
patterns:
  # rung 1 (dormant completeness) — the football: one sustained whole-note chord
  - id: fu_cp_1
    role: comping
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.46 }

  # rung 1 (variant) — two half-note footballs with a mid-bar re-voice
  - id: fu_cp_1b
    role: comping
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 960, degree: chord, velocity: 0.46 }
      - { pos: 960, dur: 960, degree: chord, velocity: 0.48 }

  # rung 2 — sparse syncopated stabs (a-of-1, e-of-3) closing with the
  # and-of-4 push that anticipates the next bar
  - id: fu_cp_2
    role: comping
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 360, dur: 240, degree: chord, velocity: 0.56 }
      - { pos: 1080, dur: 240, degree: chord, velocity: 0.54 }
      - { pos: 1680, dur: 240, degree: chord, velocity: 0.58, push: true }

  # rung 2 (variant) — downbeat anchor + two offbeat stabs, same and-of-4 push
  - id: fu_cp_2b
    role: comping
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 360, degree: chord, velocity: 0.55 }
      - { pos: 720, dur: 240, degree: chord, velocity: 0.54 }
      - { pos: 1200, dur: 240, degree: chord, velocity: 0.56 }
      - { pos: 1680, dur: 240, degree: chord, velocity: 0.58, push: true }

  # rung 3 — 16th anticipations: hits land on the 16th BEFORE beats 2, 3 and 4
  # (360 / 840 / 1320) and on the last 16th of the bar, pushed into the next
  - id: fu_cp_3
    role: comping
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 240, degree: chord, velocity: 0.66 }
      - { pos: 360, dur: 240, degree: chord, velocity: 0.68 }
      - { pos: 840, dur: 240, degree: chord, velocity: 0.66 }
      - { pos: 1320, dur: 240, degree: chord, velocity: 0.68 }
      - { pos: 1800, dur: 120, degree: chord, velocity: 0.70, push: true }

  # rung 3 (variant) — denser anticipation weave, 16th pickups into 2 and 4
  - id: fu_cp_3b
    role: comping
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 360, dur: 240, degree: chord, velocity: 0.66 }
      - { pos: 720, dur: 120, degree: chord, velocity: 0.64 }
      - { pos: 960, dur: 120, degree: chord, velocity: 0.64 }
      - { pos: 1080, dur: 240, degree: chord, velocity: 0.67 }
      - { pos: 1320, dur: 120, degree: chord, velocity: 0.65 }
      - { pos: 1680, dur: 240, degree: chord, velocity: 0.70, push: true }

  # rung 4 — clav-style stabby 16ths: short, hard, wah-ready, with the
  # and-of-4 push driving into the next bar
  - id: fu_cp_4
    role: comping
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 120, degree: chord, velocity: 0.80 }
      - { pos: 240, dur: 120, degree: chord, velocity: 0.72 }
      - { pos: 360, dur: 120, degree: chord, velocity: 0.76 }
      - { pos: 720, dur: 120, degree: chord, velocity: 0.74 }
      - { pos: 960, dur: 120, degree: chord, velocity: 0.78 }
      - { pos: 1200, dur: 120, degree: chord, velocity: 0.73 }
      - { pos: 1440, dur: 120, degree: chord, velocity: 0.76 }
      - { pos: 1680, dur: 120, degree: chord, velocity: 0.79, push: true }

  # rung 4 (variant) — the fully offbeat clav line: every hit on an off-16th,
  # last one pushed
  - id: fu_cp_4b
    role: comping
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 120, dur: 120, degree: chord, velocity: 0.74 }
      - { pos: 360, dur: 120, degree: chord, velocity: 0.78 }
      - { pos: 600, dur: 120, degree: chord, velocity: 0.73 }
      - { pos: 840, dur: 120, degree: chord, velocity: 0.77 }
      - { pos: 1080, dur: 120, degree: chord, velocity: 0.74 }
      - { pos: 1320, dur: 120, degree: chord, velocity: 0.78 }
      - { pos: 1560, dur: 120, degree: chord, velocity: 0.73 }
      - { pos: 1800, dur: 120, degree: chord, velocity: 0.80, push: true }

  # intro — settled football easing the Rhodes in, below every main rung
  - id: fu_cp_i
    role: comping
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.44 }

  # intro (variant) — two half-note swells fading in
  - id: fu_cp_ib
    role: comping
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 960, degree: chord, velocity: 0.42 }
      - { pos: 960, dur: 960, degree: chord, velocity: 0.45 }

  # ending — whole-note football, rings out under the fade
  - id: fu_cp_e
    role: comping
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.50 }

  # ending (variant) — sustain with a settling beat-4 re-voice
  - id: fu_cp_eb
    role: comping
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1440, degree: chord, velocity: 0.50 }
      - { pos: 1440, dur: 480, degree: chord, velocity: 0.48 }
