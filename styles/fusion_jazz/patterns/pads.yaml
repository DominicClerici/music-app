# fusion_jazz pads pattern bank (PHASE_8 §6.4). Sustained degree: chord blocks —
# the analog_poly/glass_pad wash under the funk. Bank retarget is the
# §6.4/constraint-13 default {45, 64, retrigger} (the pattern-fold window only —
# chord-voicing registers are owned by the arrangement pads lane, C-21).
#
# voicing.classes is §6.4 verbatim: quartal at every rung — the pack's signature
# harmony. Unlike comping (S22-4), quartal pads carry NO emptiness risk: the pads
# lane root window is >= 12 semitones in every supported mood, so [0,5,10,15]
# always places. onChordChange: retrigger per §6.4.
#
# Pads DO sound in fusion (unlike chill_lofi's dormant pads, C-22): layersMax 4
# at energetic/triumphant/happy/tense x rung >= 3 gives 4 active roles, and pads
# were measured selected at `main` rungs 3 and 4. Rungs 1-2 are authored
# completeness content (PT5 + the variety lint require an ungated bank at every
# rung); the S22-5 ruling is to author §6.4's ladder as printed, no re-map.
#
# Grid: every authored pos satisfies pos % 120 == 0 (constraint 11 — fusion is
# all-straight, no triplet content anywhere).
#
# Ladder is monotone AND the sibling velocity bands are strictly non-overlapping
# rung-to-rung, with >= 0.04 mean deltas between rungs (the C5/C6 pad-ladder
# lesson): r1 [0.28, 0.31] < r2 [0.35, 0.38] < r3 [0.42, 0.45] < r4 [0.49, 0.52].
# Main entries are sustained by design (a pad's job is stillness), so velocity —
# not density — carries the ladder; the r3/r4 `b` siblings split into two half
# notes to give the upper rungs a re-voice without adding rhythmic activity.
voicing:
  classes:
    1: [quartal]
    2: [quartal]
    3: [quartal]
    4: [quartal]
retarget: { registerLow: 45, registerHigh: 64, onChordChange: retrigger }
patterns:
  # rung 1 (dormant completeness) — softest quartal wash
  - id: fu_pd_1
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.28 }

  # rung 1 (variant) — whole-note wash a touch warmer, in-band
  - id: fu_pd_1b
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.31 }

  # rung 2 — quartal wash, band opens above rung 1
  - id: fu_pd_2
    role: pads
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.35 }

  # rung 2 (variant) — whole-note wash, in-band
  - id: fu_pd_2b
    role: pads
