      - { pos: 1080, voice: kick, velocity: 0.62 }
      - { pos: 1440, voice: perc, velocity: 0.50 }
      - { pos: 1800, voice: perc, velocity: 0.40 }
      - { pos: 240, voice: hat_closed, velocity: 0.36 }
      - { pos: 720, voice: hat_closed, velocity: 0.30 }
      - { pos: 1200, voice: hat_closed, velocity: 0.36 }
      - { pos: 1680, voice: hat_closed, velocity: 0.30 }

