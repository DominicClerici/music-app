# fusion_jazz drum pattern bank (PHASE_8 §6.4).
# Rung 1 is dead grid-wide: the lowest body section energy (breakdown/main/head
# base at the coldest supported arousal) sits at pre-envelope ~0.185 → rung 2
# under the [0.20, 0.95] envelope, so no supported (mood × position) render
# selects a rung-1 main. Rung-1 mains are PT5/variety completeness only and are
# annotated per-id below (# expected-unreachable, C-28); the reachability lint
# now sees this. Drum events only — drums are lane-exempt (§5.2), so no retarget (PT9).
# Carries the pack-level layeringOrder (PT10, once per pack).
#
# Ladder authored EXACTLY as §6.4 prints it — NO re-map (S22-5, user-ratified).
# Scoping measured rung 1 as dead grid-wide and rung 4 as `tune`-template-only;
# rungs 2–3 carry the defining content and are live. PT5 + the variety lint
# require a full rung-1..4 bank regardless, so rung 1 is authored as §6.4's
# sparse-funk tier and its dormancy is caveat-recorded (C-28), not annotated
# here (the [0.20, 0.95] envelope makes all four rungs lint-reachable).
#
# GRID: every authored `pos` satisfies `pos % 120 == 0` — fusion is all-straight
# (16ths = 120 ticks). There is NO triplet content anywhere in this pack, so W7
# (§3.1 one-grid-per-Phrase, pre-humanizer) cannot fire from this bank. §6.1's
# "Purdie-shuffle territory" note is a feel observation about the swing16 ratio,
# not an instruction to author 160/320 offsets (C-24 lesson).
#
# cross-stick is authored as the `perc` voice — no `cross_stick` member exists in
# the DrumVoice enum (established chill_lofi rim→perc §3.6 precedent).
#
# id scheme: the numeric suffix tracks the RUNG; `b` is the weight-2 sibling of
# the weight-3 anchor (the 3/2 convention), intro `i`/`ib`, ending `e`/`eb`,
# fills `f1`/`f2`/`f3`. Every main/intro/ending entry is UNGATED, so each of the
# 6 variety slots (main 1–4, intro, ending) has exactly 2 surviving candidates
# at every supported (mood, tempo) cell.
layeringOrder: [drums, bass, comping, pads]
patterns:
  # rung 1 (dormant per C-28) — sparse funk: kick on 1, cross-stick (perc) on
  # 2 and 4, straight 8th hats
  - id: fu_dr_1  # expected-unreachable — C-28: rung-1 main, rung 1 dead grid-wide (lowest body section floors at rung 2)
    role: drums
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, voice: kick, velocity: 0.80 }
      - { pos: 480, voice: perc, velocity: 0.50 }
      - { pos: 1440, voice: perc, velocity: 0.48 }
      - { pos: 0, voice: hat_closed, velocity: 0.40 }
      - { pos: 240, voice: hat_closed, velocity: 0.30 }
      - { pos: 480, voice: hat_closed, velocity: 0.36 }
      - { pos: 720, voice: hat_closed, velocity: 0.30 }
      - { pos: 960, voice: hat_closed, velocity: 0.38 }
      - { pos: 1200, voice: hat_closed, velocity: 0.30 }
      - { pos: 1440, voice: hat_closed, velocity: 0.36 }
      - { pos: 1680, voice: hat_closed, velocity: 0.32 }

  # rung 1 (dormant, sibling) — a genuinely different sparse-funk reading rather
  # than a nudge of `fu_dr_1`: the kick answers late on the "a" of 3 instead of
  # anchoring 1-and-3, the cross-stick (perc) moves off the 2/4 backbeat onto 4
  # and the "a" of 4, and the hat bed inverts to OFFBEAT 8ths only, so the bar
  # floats rather than marking the pulse. Still 8th-grid and still rung-1 sparse
  # (8 events vs `fu_dr_1`'s 11, same 0.80 peak); the pair now shares only 6 of
  # 13 (pos, voice) slots instead of 11 of 12, which is what a variety pair is
  # for. Rung 1 is dormant (C-28), so this is completeness work, not audible.
  - id: fu_dr_1b  # expected-unreachable — C-28: rung-1 main, rung 1 dead grid-wide (lowest body section floors at rung 2)
    role: drums
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
