  # rung 2 (variant) — whole-note wash, in-band
  - id: lf_pd_2b
    role: pads
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.36 }

  # rung 3 — whole-note wash, gently fuller
  - id: lf_pd_3
    role: pads
    kind: main
