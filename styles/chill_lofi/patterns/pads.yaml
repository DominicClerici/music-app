# chill_lofi pads pattern bank (PHASE_8 §4.4). Sustained degree: chord hits;
# lo-fi pads voice the `fifths` class at every rung. Bank retarget is the §4.4
# default {45, 64, retrigger} (the pattern-fold window only — chord-voicing
# registers are owned by the arrangement pads lane [43, 71], C-21). Velocities
# LOW and much quieter than comping; a soft wash under the beat. Pads are
# articulation-exempt.
#
# Ladders are MONOTONE across rungs (C5 T7): every entry is a single whole-note
# wash (siblings a beat-fractioned re-voice at intro/ending only), and mean
# velocity rises with the rung and never inverts; each b-sibling sits inside its
# rung's velocity band.
#
# expected-unreachable: the 0.60 energy ceiling makes rung 4 unselectable
# (§4.2); rung-4 mains exist for PT5 completeness only.
voicing:
  classes:
    1: [fifths]
    2: [fifths]
    3: [fifths]
    4: [fifths]
retarget: { registerLow: 45, registerHigh: 64, onChordChange: retrigger }
patterns:
  # rung 1 — whole-note wash, the stillest and quietest
  - id: lf_pd_1
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.25 }

  # rung 1 (variant) — whole-note wash a touch warmer, in-band
  - id: lf_pd_1b
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.30 }

  # rung 2 — whole-note wash
  - id: lf_pd_2
    role: pads
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 3
    events:
