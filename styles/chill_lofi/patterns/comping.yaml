# chill_lofi comping pattern bank (PHASE_8 §4.4). degree: chord rhythm cells;
# the voicing pass supplies pitches. Bank retarget is the §4.4 default
# {50, 69, retrigger} (the pattern-fold window only — chord-voicing registers
# are owned by the arrangement comping lane [48, 71], C-21). voicing.classes
# maps each rung to candidate classes (PT7): the research's 3-5-7-9 / 7-9-3-5
# rootless voicings above rung 2. Velocities lo-fi quiet (mellow EP, nothing
# above ~0.55). The 0.60 energy ceiling keeps every body section at rung 2
# (§4.2), so rungs 1/3/4 mains are unreachable — authored for PT5 completeness
# only and annotated per-id below (# expected-unreachable, C-22).
voicing:
  classes:
    1: [shell3, triad_close]
    2: [rootless_a, rootless_b]
    3: [rootless_a, rootless_b]
    4: [rootless_a, rootless_b]
retarget: { registerLow: 50, registerHigh: 69, onChordChange: retrigger }
patterns:
  # rung 1 — whole-note block, the stillest comp
  - id: lf_cp_1  # expected-unreachable — C-22: rung-1 main, below the reachable rung 2 (0.60 energy ceiling)
    role: comping
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.44 }

  # rung 1 (variant) — two soft half-note blocks, same sustained foundation
  # with a gentle mid-bar re-voice
  - id: lf_cp_1b  # expected-unreachable — C-22: rung-1 main, below the reachable rung 2 (0.60 energy ceiling)
    role: comping
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 900, degree: chord, velocity: 0.42 }
      - { pos: 960, dur: 900, degree: chord, velocity: 0.44 }

  # rung 2 — downbeat halves
  - id: lf_cp_2
    role: comping
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 900, degree: chord, velocity: 0.47 }
      - { pos: 960, dur: 900, degree: chord, velocity: 0.45 }

  # rung 2 (variant) — chord on 1, an anticipated chord on 2& held across
  # beat 3 (a laid-back off-beat lean, same rung-2 weight)
  - id: lf_cp_2b
    role: comping
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 660, degree: chord, velocity: 0.47 }
      - { pos: 720, dur: 1200, degree: chord, velocity: 0.45 }

  # rung 3 — offbeat-stab variant: soft stabs on the &s with an and-of-4
  # (pos 1680) push anticipating the next bar
  - id: lf_cp_3  # expected-unreachable — C-22: rung-3 main, 0.60 energy ceiling caps every body section at rung 2
    role: comping
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 240, dur: 240, degree: chord, velocity: 0.48 }
      - { pos: 720, dur: 240, degree: chord, velocity: 0.50 }
      - { pos: 1680, dur: 240, degree: chord, velocity: 0.52, push: true }

  # rung 3 (variant) — offbeat stabs shifted to 1& and 3&, same and-of-4 push
  - id: lf_cp_3b  # expected-unreachable — C-22: rung-3 main, 0.60 energy ceiling caps every body section at rung 2
    role: comping
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 240, dur: 240, degree: chord, velocity: 0.48 }
      - { pos: 1200, dur: 240, degree: chord, velocity: 0.50 }
      - { pos: 1680, dur: 240, degree: chord, velocity: 0.52, push: true }

  # rung 4 (unreachable; completeness) — marginally fuller rung-3 stab shape:
  # an added mid-bar stab over the rung-3 offbeat figure, and-of-4 push kept
  - id: lf_cp_4  # expected-unreachable — C-22: rung-4 main, 0.60 energy ceiling caps every body section at rung 2
    role: comping
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 240, dur: 240, degree: chord, velocity: 0.50 }
      - { pos: 720, dur: 240, degree: chord, velocity: 0.52 }
      - { pos: 1200, dur: 240, degree: chord, velocity: 0.50 }
      - { pos: 1680, dur: 240, degree: chord, velocity: 0.54, push: true }

  # rung 4 (variant, unreachable) — sibling fuller stab shape, added beat-4
  # stab instead of the 3& hit
  - id: lf_cp_4b  # expected-unreachable — C-22: rung-4 main, 0.60 energy ceiling caps every body section at rung 2
    role: comping
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 240, dur: 240, degree: chord, velocity: 0.50 }
      - { pos: 720, dur: 240, degree: chord, velocity: 0.52 }
      - { pos: 1440, dur: 240, degree: chord, velocity: 0.50 }
      - { pos: 1680, dur: 240, degree: chord, velocity: 0.54, push: true }

  # intro — settled whole-note block
  - id: lf_cp_i
    role: comping
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.40 }

  # intro (variant) — two soft swells easing in
  - id: lf_cp_ib
    role: comping
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 960, degree: chord, velocity: 0.38 }
      - { pos: 960, dur: 960, degree: chord, velocity: 0.40 }

  # ending — settled whole-note block, rings out
  - id: lf_cp_e
    role: comping
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.42 }

  # ending (variant) — sustain with a settling beat-4 decrescendo re-voice
  - id: lf_cp_eb
    role: comping
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 1440, degree: chord, velocity: 0.42 }
      - { pos: 1440, dur: 480, degree: chord, velocity: 0.40 }
