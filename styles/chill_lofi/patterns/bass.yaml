# chill_lofi bass pattern bank (PHASE_8 §4.4). Pattern mode; pitched events
# author chord-degrees, never literal pitches (invariant 2). retarget is the
# bank-level §7 default {28, 45, retrigger} (span 17 >= 12, PT9); the loader
# injects it into every entry. Straight-16 grid only (positions multiples of
# 120; swing16 supplies the feel). Velocities quiet (§4.4).
#
# The 0.60 energy ceiling makes rung 4 unreachable (§4.2); rung-4 mains are
# authored for PT5 completeness only as gated-ghost extensions of rung 3.
# expected-unreachable  (silences this file's unreachable-content lint, §9.2)
mode: patterns
retarget: { registerLow: 28, registerHigh: 45, onChordChange: retrigger }
patterns:
  # rung 1 — whole-note root
  - id: lf_bs_1
    role: bass
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, dur: 1920, degree: root, octave: 0, velocity: 0.62 }

  # rung 1 (variant) — half-note roots (beats 1 and 3); same held-root
  # foundation as lf_bs_1 with a gentle mid-bar re-attack
  - id: lf_bs_1b
    role: bass
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 2
    events:
      - { pos: 0, dur: 960, degree: root, octave: 0, velocity: 0.62 }
      - { pos: 960, dur: 960, degree: root, octave: 0, velocity: 0.58 }

  # rung 2 — root + fifth halves (root beat 1, fifth beat 3)
  - id: lf_bs_2
    role: bass
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 3
    events:
