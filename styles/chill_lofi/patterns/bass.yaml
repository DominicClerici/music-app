      - { pos: 960, dur: 960, degree: fifth, octave: 0, velocity: 0.60 }

  # rung 2 (variant) — root half + fifth/root quarters; same root-fifth palette
  # as lf_bs_2 with a mid-bar re-articulation
  - id: lf_bs_2b
    role: bass
    kind: main
