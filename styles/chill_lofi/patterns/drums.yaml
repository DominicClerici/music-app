# chill_lofi drum pattern bank (PHASE_8 §4.4). Straight-16 grid only (positions
# are multiples of 120; the swing16 transform supplies the laid-back feel).
# Drum events only — drums are lane-exempt (§5.2), so no retarget. Carries the
# pack-level layeringOrder (§5.1/PT10). Velocities quiet and varied, nothing
# above ~0.85 (§4.4).
#
# The 0.60 energy ceiling makes rung 4 unreachable (§4.2); rung-4 mains are
# authored for PT5 completeness only as marginally-fuller rung-3 variants.
# expected-unreachable  (silences this file's unreachable-content lint, §9.2)
#
# rim mapping: PHASE_8 §4.4's rung-4 "rim layer" uses the `perc` voice — no
# `rim` voice exists in the engine's DrumVoice vocabulary, and §4.2 (line 132)
# pins `perc` as the carrier for lo-fi shaker/rim/tambourine.
layeringOrder: [drums, bass, comping, pads]
patterns:
