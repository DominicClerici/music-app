  - id: lf_dr_1
    role: drums
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 3
    events:
      - { pos: 0, voice: kick, velocity: 0.72 }
      - { pos: 960, voice: snare, velocity: 0.64 }
      - { pos: 0, voice: hat_closed, velocity: 0.35 }
      - { pos: 480, voice: hat_closed, velocity: 0.30 }
      - { pos: 960, voice: hat_closed, velocity: 0.33 }
      - { pos: 1440, voice: hat_closed, velocity: 0.30 }

