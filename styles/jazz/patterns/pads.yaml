# jazz pads pattern bank (PHASE_5 §7.4). Quartal footballs at every rung. Jazz
# pads are dormant in v1 (layersMax 3 — the trio), but the bank MUST exist for
# PT5 completeness. Whole-note degree: chord hits; retarget is the bank-level §7
# default {45, 64, retrigger}; voicing.classes is quartal at every rung (PT7).
voicing:
  classes:
    1: [quartal]
    2: [quartal]
    3: [quartal]
    4: [quartal]
retarget: { registerLow: 45, registerHigh: 64, onChordChange: retrigger }
patterns:
  - id: jz_pd_1  # expected-unreachable — C-20: rung-1 main, golden-blind (verse/bridge floor keeps every body section at rung 2+)
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.45 }

  - id: jz_pd_2
    role: pads
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.45 }

  - id: jz_pd_3
    role: pads
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.50 }

  - id: jz_pd_4
    role: pads
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.50 }

  - id: jz_pd_i
    role: pads
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.45 }

  - id: jz_pd_e
    role: pads
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.45 }

  # --- variant candidates (quartal footballs, distinct rhythmic shape from the
  # whole-note siblings): busyness rises with rung — rungs 1-3 re-voice as a
  # dotted-half + quarter (a gentle late re-attack), rung 4 as two half notes
  # (the busiest); escalating velocity by rung ---

  # rung 1 (variant) — dotted-half + quarter (gentle)
  - id: jz_pd_1b  # expected-unreachable — C-20: rung-1 main, golden-blind (verse/bridge floor keeps every body section at rung 2+)
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1440, degree: chord, velocity: 0.44 }
      - { pos: 1440, dur: 480, degree: chord, velocity: 0.42 }

  # rung 2 (variant) — dotted-half + quarter
  - id: jz_pd_2b
    role: pads
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1440, degree: chord, velocity: 0.46 }
      - { pos: 1440, dur: 480, degree: chord, velocity: 0.44 }

  # rung 3 (variant) — dotted-half + quarter (gentle, no busier than rung 4)
  - id: jz_pd_3b
    role: pads
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1440, degree: chord, velocity: 0.50 }
      - { pos: 1440, dur: 480, degree: chord, velocity: 0.48 }

  # rung 4 (variant) — two half notes (the busiest b-variant)
  - id: jz_pd_4b
    role: pads
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 960, degree: chord, velocity: 0.52 }
      - { pos: 960, dur: 960, degree: chord, velocity: 0.50 }

