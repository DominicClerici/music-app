# pop_rock comping pattern bank (PHASE_5 §7.3). degree: chord rhythm cells; the
# voicing pass (§6.4) supplies pitches. retarget is the bank-level §7 default
# {52, 67, retrigger}; voicing.classes maps each rung to candidate classes (PT7).
voicing:
  classes:
    1: [triad_close, triad_open]
    2: [triad_close, triad_open]
    3: [triad_close, shell3]
    4: [triad_close, shell3]
retarget: { registerLow: 52, registerHigh: 67, onChordChange: retrigger }
patterns:
  # rung 1 — whole-note block
  - id: pr_cp_1
    role: comping
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.55 }

  # rung 1 (variant) — bar-length block with a fresh chord on beat 4 anticipating
  # the next bar. Same sustained foundation as pr_cp_1, a gentle push added
  - id: pr_cp_1b
    role: comping
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1440, degree: chord, velocity: 0.55 }
      - { pos: 1440, dur: 480, degree: chord, velocity: 0.52 }

  # rung 2 — downbeat halves (GOLDEN ANCHOR)
  - id: pr_cp_2
    role: comping
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 900, degree: chord, velocity: 0.62 }
      - { pos: 960, dur: 900, degree: chord, velocity: 0.58 }

  # rung 2 (variant) — syncopated two-hit block: chord on 1, anticipated chord
  # on 2& held across beat 3 (a Charleston-flavoured pop comp). Same rung-2
  # weight as pr_cp_2, off-beat lean
  - id: pr_cp_2b
    role: comping
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 660, degree: chord, velocity: 0.62 }
      - { pos: 720, dur: 1200, degree: chord, velocity: 0.58 }

  # rung 3 — "old faithful" strum shape D D U U D(push)
  - id: pr_cp_3
    role: comping
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 420, degree: chord, velocity: 0.66 }
      - { pos: 480, dur: 200, degree: chord, velocity: 0.60 }
      - { pos: 720, dur: 200, degree: chord, velocity: 0.52 }
      - { pos: 1200, dur: 200, degree: chord, velocity: 0.54 }
      - { pos: 1680, dur: 220, degree: chord, velocity: 0.60, push: true }

  # rung 4 — pulsing 8ths (0.68 on / 0.55 off), final 8th pushed
  - id: pr_cp_4
    role: comping
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 240, dur: 200, degree: chord, velocity: 0.55 }
      - { pos: 480, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 720, dur: 200, degree: chord, velocity: 0.55 }
      - { pos: 960, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 1200, dur: 200, degree: chord, velocity: 0.55 }
      - { pos: 1440, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 1680, dur: 200, degree: chord, velocity: 0.66, push: true }

  # rung 3 (variant) — busier upstroke strum D D U U D U(push), the offbeat
  # ups driving harder than pr_cp_3's shape
  - id: pr_cp_3b
    role: comping
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 420, degree: chord, velocity: 0.66 }
      - { pos: 480, dur: 200, degree: chord, velocity: 0.60 }
      - { pos: 720, dur: 200, degree: chord, velocity: 0.54 }
      - { pos: 1200, dur: 200, degree: chord, velocity: 0.54 }
      - { pos: 1440, dur: 200, degree: chord, velocity: 0.60 }
      - { pos: 1680, dur: 220, degree: chord, velocity: 0.58, push: true }

  # rung 4 (variant) — driving 8ths with an added 16th push into the bar end,
  # a harder-edged pulse than pr_cp_4
  - id: pr_cp_4b
    role: comping
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 240, dur: 200, degree: chord, velocity: 0.55 }
      - { pos: 480, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 720, dur: 200, degree: chord, velocity: 0.55 }
      - { pos: 960, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 1200, dur: 200, degree: chord, velocity: 0.55 }
      - { pos: 1440, dur: 120, degree: chord, velocity: 0.62 }
      - { pos: 1560, dur: 120, degree: chord, velocity: 0.52 }
      - { pos: 1680, dur: 200, degree: chord, velocity: 0.66, push: true }

  # intro — whole-note block
  - id: pr_cp_i
    role: comping
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.50 }

  # intro (variant) — two soft half-note blocks building a pulse into the first
  # section, gentler than pr_cp_i's single sustain
  - id: pr_cp_ib
    role: comping
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 900, degree: chord, velocity: 0.48 }
      - { pos: 960, dur: 900, degree: chord, velocity: 0.50 }

  # ending — whole-note block
  - id: pr_cp_e
    role: comping
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.60 }

  # ending (variant) — accented downbeat stab then a full sustain to close, a
  # more emphatic button than pr_cp_e's even block
  - id: pr_cp_eb
    role: comping
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 480, degree: chord, velocity: 0.64 }
      - { pos: 480, dur: 1440, degree: chord, velocity: 0.56 }
