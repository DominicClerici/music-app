# pop_rock comping pattern bank (PHASE_5 §7.3). degree: chord rhythm cells; the
# voicing pass (§6.4) supplies pitches. retarget is the bank-level §7 default
# {52, 67, retrigger}; voicing.classes maps each rung to candidate classes (PT7).
voicing:
  classes:
    1: [triad_close, triad_open]
    2: [triad_close, triad_open]
    3: [triad_close, shell3]
    4: [triad_close, shell3]
retarget: { registerLow: 52, registerHigh: 67, onChordChange: retrigger }
patterns:
  # rung 1 — whole-note block
  - id: pr_cp_1
    role: comping
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.55 }

  # rung 2 — downbeat halves (GOLDEN ANCHOR)
  - id: pr_cp_2
    role: comping
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 900, degree: chord, velocity: 0.62 }
      - { pos: 960, dur: 900, degree: chord, velocity: 0.58 }

  # rung 3 — "old faithful" strum shape D D U U D(push)
  - id: pr_cp_3
    role: comping
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 420, degree: chord, velocity: 0.66 }
      - { pos: 480, dur: 200, degree: chord, velocity: 0.60 }
      - { pos: 720, dur: 200, degree: chord, velocity: 0.52 }
      - { pos: 1200, dur: 200, degree: chord, velocity: 0.54 }
      - { pos: 1680, dur: 220, degree: chord, velocity: 0.60, push: true }

  # rung 4 — pulsing 8ths (0.68 on / 0.55 off), final 8th pushed
  - id: pr_cp_4
    role: comping
    kind: main
    energyLevel: 4
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 240, dur: 200, degree: chord, velocity: 0.55 }
      - { pos: 480, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 720, dur: 200, degree: chord, velocity: 0.55 }
      - { pos: 960, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 1200, dur: 200, degree: chord, velocity: 0.55 }
      - { pos: 1440, dur: 200, degree: chord, velocity: 0.68 }
      - { pos: 1680, dur: 200, degree: chord, velocity: 0.66, push: true }

  # intro — whole-note block
  - id: pr_cp_i
    role: comping
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.50 }

  # ending — whole-note block
  - id: pr_cp_e
    role: comping
    kind: ending
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.60 }
