      - { pos: 0, dur: 960, degree: chord, velocity: 0.55 }
      - { pos: 960, dur: 960, degree: chord, velocity: 0.50 }

  # rung 3 (variant) — half + two quarters, a pulsing pad matching the busier rung
  - id: pr_pd_3b
    role: pads
    kind: main
    energyLevel: 3
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 960, degree: chord, velocity: 0.50 }
      - { pos: 960, dur: 480, degree: chord, velocity: 0.48 }
      - { pos: 1440, dur: 480, degree: chord, velocity: 0.48 }

  # rung 4 (variant) — quarter-note pulse, the most driving pad texture
  - id: pr_pd_4b
