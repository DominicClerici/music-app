      - { pos: 1440, dur: 480, degree: chord, velocity: 0.50 }

  - id: pr_pd_i
    role: pads
    kind: intro
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.45 }

  # intro (variant) — two soft swells rising in, a fade-in feel
  - id: pr_pd_ib
