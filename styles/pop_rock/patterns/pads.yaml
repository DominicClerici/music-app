# pop_rock pads pattern bank (PHASE_5 §7.3). Sustained degree: chord hits; pop
# pads voice the `fifths` class (§6.5). retarget is the bank-level §7 default
# {45, 64, retrigger}. Pads are articulation-exempt (§3.4).
voicing:
  classes:
    1: [fifths]
    2: [fifths]
    3: [fifths]
    4: [fifths]
retarget: { registerLow: 45, registerHigh: 64, onChordChange: retrigger }
patterns:
  # rungs 1-3 whole-note chord; rung 4 half-note pulse
  - id: pr_pd_1
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.45 }

  - id: pr_pd_2
    role: pads
    kind: main
    energyLevel: 2
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 1920, degree: chord, velocity: 0.45 }

  # rung 1 (variant) — two half-note swells, a gentle pulse under the stillest
  # texture
  - id: pr_pd_1b
    role: pads
    kind: main
    energyLevel: 1
    lengthTicks: 1920
    weight: 1
    events:
      - { pos: 0, dur: 960, degree: chord, velocity: 0.45 }
      - { pos: 960, dur: 960, degree: chord, velocity: 0.43 }

  # rung 2 (variant) — bar sustain with a soft beat-4 re-voice
  - id: pr_pd_2b
    role: pads
