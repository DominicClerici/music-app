# The (class, option-path) allowlist (PHASE_7 §5.2, D12) — fully expanded, no
# wildcards. Seed = union of §5.2's illustrative blocks, every §5.1 mod_defaults
# param, every §8 reference-recipe path, and every PHASE_1 milestone-fixture
# path. `envelope.*` -> attack/decay/sustain/release/attackCurve;
# `modulationEnvelope.*` -> attack/decay/sustain/release. Extended by amendment.

