name: gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pytest -n auto
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
