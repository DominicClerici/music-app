[project]
name = "trackgen"
version = "0.1.0"
description = "Algorithmic backing-track generator: structured params -> Tone.js TrackDocument JSON."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "music21",
    "typer",
]

[project.scripts]
trackgen = "trackgen.cli:app"

# Runtime deps carry lower bounds here; exact pins live in the committed uv.lock,
# so a dependency bump is a deliberate, reviewed re-lock (PHASE_1 D16).

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "hypothesis",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackgen"]

# --- Ruff: formatter + linter ------------------------------------------------

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

# Determinism invariant 5 (ROADMAP §3): no ambient entropy or wall-clock outside
# the seed boundary. The banned-api rule (TID251) turns this into an enforced gate.
# Full call-level enforcement + the determinism-guard test land in the PHASE_1 DoD;
# this is the declarative import-level layer.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Use the seed streams API (trackgen.seeds); direct `random` breaks determinism (invariant 5)."
"secrets".msg = "Entropy may enter only at the seed API boundary (trackgen.seeds)."
"uuid".msg = "Non-deterministic identifiers break reproducibility (invariant 5)."
"os.urandom".msg = "Entropy may enter only at the seed API boundary (trackgen.seeds)."
"time".msg = "No wall-clock in a deterministic pipeline (invariant 5)."
"datetime.datetime.now".msg = "No wall-clock in a deterministic pipeline (invariant 5)."
"datetime.datetime.utcnow".msg = "No wall-clock in a deterministic pipeline (invariant 5)."
"datetime.datetime.today".msg = "No wall-clock in a deterministic pipeline (invariant 5)."
"datetime.date.today".msg = "No wall-clock in a deterministic pipeline (invariant 5)."

[tool.ruff.lint.per-file-ignores]
# seeds.py is the single entropy boundary: it may read os.urandom and use random.
"src/trackgen/seeds.py" = ["TID251"]
# tests legitimately construct raw RNGs to assert determinism.
"tests/**" = ["TID251"]

# --- mypy: strict ------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# music21 ships no type stubs; the theory wrapper contains it (PHASE_1 §2).
[[tool.mypy.overrides]]
module = ["music21.*"]
ignore_missing_imports = true

# --- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
